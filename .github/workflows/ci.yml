name: CI

on:
  push:
    branches: [development, main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (with dev and type-check extras)
        run: uv pip install -e ".[dev,typecheck]"
      - name: Type check
        run: uv run --no-sync mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: uv pip install -e ".[dev,ingest,langchain,dspy,llamaindex,haystack]"
      - name: Lint
        run: uv run --no-sync ruff check src benchmarks
      - name: Test
        run: uv run --no-sync pytest -q
