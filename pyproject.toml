[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynavec"
version = "0.1.0"
description = "Serverless hybrid vector database for AWS: fuses DynamoDB (single-digit-ms metadata + document store) with Amazon S3 Vectors (billion-scale serverless ANN). A drop-in, in-your-own-account alternative to Pinecone / Qdrant / Milvus / Weaviate / OpenSearch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "dynavec contributors" }]
keywords = [
    "vector-database", "vector-search", "rag", "embeddings", "dynamodb",
    "s3-vectors", "aws", "serverless", "semantic-search", "ann",
    "langchain", "llamaindex", "pinecone-alternative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
]

# Base install stays light: boto3 (AWS) + numpy (vector math) only.
dependencies = [
    "boto3>=1.40.0",
    "botocore>=1.40.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# --- Pluggable, bring-your-own-key embedders (users pick one or more) ---
openai = ["openai>=1.40"]
gemini = ["google-generativeai>=0.8"]
cohere = ["cohere>=5.0"]
sentence-transformers = ["sentence-transformers>=3.0"]
# bedrock needs nothing beyond boto3.

# --- Optional capabilities ---
rerank = ["sentence-transformers>=3.0"]         # cross-encoder reranking
langchain = ["langchain-core>=0.3"]
all = [
    "openai>=1.40",
    "google-generativeai>=0.8",
    "cohere>=5.0",
    "sentence-transformers>=3.0",
    "langchain-core>=0.3",
]

# --- Dev / test / benchmark ---
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[dynamodb]>=5.0",
    "ruff>=0.6",
]
benchmark = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.urls]
Homepage = "https://github.com/your-org/dynavec"
Documentation = "https://github.com/your-org/dynavec#readme"
Issues = "https://github.com/your-org/dynavec/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dynavec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
